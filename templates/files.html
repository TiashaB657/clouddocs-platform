<!DOCTYPE html>
<html>
<head>
    <title>Uploaded Files</title>
</head>
<body>

<h1>Uploaded Files</h1>

<ul>
{% if files %}

<ul>
{% for file in files %}
    <li>
    <a href="/uploads/{{ file }}">
        {{ file }}
    </a>
</li>
{% endfor %}
</ul>

{% else %}

<p>No files uploaded yet.</p>

{% endif %}
</ul>

</body>
</html>
